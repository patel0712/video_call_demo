name: bloc_clean_architecture
description: A Flutter video calling app with AWS Chime SDK integration, authentication, and user management.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.1
  dio: ^5.3.3
  equatable: ^2.0.5
  google_fonts: ^6.1.0
  fluttertoast: ^8.2.2
  dartz: ^0.10.1
  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.1
  get_it: ^7.6.4
  flutter_spinkit: ^5.2.0
  form_field_validator: ^1.1.0
  go_router: ^13.0.1
  logger: ^2.3.0
  font_awesome_flutter: ^10.7.0
  bloc_concurrency: ^0.2.5
  # Video calling dependencies
  flutter_aws_chime: ^1.0.0
  permission_handler: ^11.0.1
  cached_network_image: ^3.3.0
  connectivity_plus: ^5.0.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^3.1.0
  flutter_lints: ^2.0.0
  mocktail: ^0.3.0
  bloc_test: ^9.0.0
  build_runner: ^2.4.6
  mockito: ^5.4.4
  json_serializable: ^6.7.1
  freezed: ^2.4.7


flutter:
  uses-material-design: true
  # assets:
    # - assets/images/